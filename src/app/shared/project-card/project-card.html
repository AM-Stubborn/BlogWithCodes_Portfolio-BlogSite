<article class="group surface overflow-hidden transition duration-300 hover:-translate-y-1 hover:border-accent/30 hover:shadow-lg hover:shadow-accent/5">
  <a [routerLink]="['/projects', project.slug]" class="block">
    <div class="relative aspect-[16/9] overflow-hidden bg-mist">
      <img
        [src]="project.cover | assetUrl"
        [alt]="project.title"
        class="h-full w-full object-cover transition duration-500 group-hover:scale-105"
        loading="lazy"
      />
      <div class="absolute inset-0 bg-gradient-to-t from-ink/50 via-transparent to-transparent"></div>
      <span class="absolute bottom-3 left-3 inline-flex items-center gap-1.5 rounded-lg bg-white/90 px-2.5 py-1 font-display text-xs font-semibold text-ink backdrop-blur">
        <app-icon name="briefcase" className="h-3.5 w-3.5 text-accent" />
        {{ project.domain }}
      </span>
    </div>

    <div class="p-6">
      <p class="text-xs font-semibold tracking-wide text-ink-soft/55 uppercase">{{ project.year }} · {{ project.role }}</p>
      <h3 class="font-display mt-2 text-xl font-semibold tracking-tight text-ink transition group-hover:text-accent">
        {{ project.title }}
      </h3>
      <p class="mt-3 text-sm leading-relaxed text-ink-soft/75">{{ project.excerpt }}</p>
      <div class="mt-5 flex flex-wrap gap-2">
        @for (tag of project.tags; track tag) {
          <span class="rounded-md bg-mist px-2.5 py-1 text-xs font-medium text-ink-soft/80">{{ tag }}</span>
        }
      </div>
      <span class="mt-5 inline-flex items-center gap-2 font-display text-sm font-semibold text-ink">
        View project
        <app-icon name="arrow-right" className="h-4 w-4 transition group-hover:translate-x-1" />
      </span>
    </div>
  </a>
</article>
