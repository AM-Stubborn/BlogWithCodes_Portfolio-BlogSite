<article class="group surface overflow-hidden transition duration-300 hover:-translate-y-1 hover:border-accent/30 hover:shadow-lg hover:shadow-accent/5">
  <a [routerLink]="['/blog', post.slug]" class="block overflow-hidden">
    <div class="relative aspect-[16/9] bg-mist">
      <img
        [src]="coverSrc | assetUrl"
        [alt]="post.cover ? post.title : 'BlogWithCodes'"
        class="h-full w-full object-cover transition duration-500 group-hover:scale-105"
        loading="lazy"
      />
      <div class="absolute inset-0 bg-gradient-to-t from-ink/40 via-transparent to-transparent"></div>
      <span class="absolute top-2.5 left-2.5 inline-flex items-center gap-1 rounded-lg bg-white/90 px-2 py-0.5 font-display text-[0.7rem] font-semibold text-ink backdrop-blur">
        <app-icon name="book" className="h-3 w-3 text-accent" />
        {{ formatCategory(post.category) }}
      </span>
    </div>
  </a>

  <div class="p-5 sm:p-6">
    <div class="flex flex-wrap items-center gap-2.5 text-[0.7rem] font-semibold tracking-wide text-ink-soft/55 uppercase">
      <span class="inline-flex items-center gap-1">
        <app-icon name="calendar" className="h-3 w-3" />
        <time [attr.datetime]="post.date">{{ formatDate(post.date) }}</time>
      </span>
      <span aria-hidden="true">·</span>
      <span class="inline-flex items-center gap-1">
        <app-icon name="clock" className="h-3 w-3" />
        {{ post.readingTime }}
      </span>
    </div>

    <h3 class="font-display mt-2.5 text-lg font-semibold tracking-tight text-ink transition group-hover:text-accent">
      <a [routerLink]="['/blog', post.slug]" class="outline-none">{{ post.title }}</a>
    </h3>
    <p class="mt-2.5 line-clamp-3 text-[0.8125rem] leading-relaxed text-ink-soft/75">{{ post.excerpt }}</p>

    <a
      [routerLink]="['/blog', post.slug]"
      class="mt-4 inline-flex items-center gap-1.5 font-display text-[0.8125rem] font-semibold text-ink"
    >
      Read post
      <app-icon name="arrow-right" className="h-3.5 w-3.5 transition group-hover:translate-x-1" />
    </a>
  </div>
</article>
