<article class="group surface overflow-hidden transition duration-300 hover:-translate-y-1 hover:border-accent/30 hover:shadow-lg hover:shadow-accent/5">
  @if (post.cover) {
    <a [routerLink]="['/blog', post.slug]" class="block overflow-hidden">
      <div class="relative aspect-[16/10] bg-mist">
        <img
          [src]="post.cover | assetUrl"
          [alt]="post.title"
          class="h-full w-full object-cover transition duration-500 group-hover:scale-105"
          loading="lazy"
        />
        <div class="absolute inset-0 bg-gradient-to-t from-ink/40 via-transparent to-transparent"></div>
        <span class="absolute top-3 left-3 inline-flex items-center gap-1.5 rounded-lg bg-white/90 px-2.5 py-1 font-display text-xs font-semibold text-ink backdrop-blur">
          <app-icon name="book" className="h-3.5 w-3.5 text-accent" />
          {{ formatCategory(post.category) }}
        </span>
      </div>
    </a>
  }

  <div class="p-6 sm:p-7">
    <div class="flex flex-wrap items-center gap-3 text-xs font-semibold tracking-wide text-ink-soft/55 uppercase">
      @if (!post.cover) {
        <a
          [routerLink]="['/blog/category', post.category]"
          class="inline-flex items-center gap-1 text-accent transition hover:text-accent-bright"
        >
          <app-icon name="tag" className="h-3.5 w-3.5" />
          {{ formatCategory(post.category) }}
        </a>
        <span aria-hidden="true">·</span>
      }
      <span class="inline-flex items-center gap-1">
        <app-icon name="calendar" className="h-3.5 w-3.5" />
        <time [attr.datetime]="post.date">{{ formatDate(post.date) }}</time>
      </span>
      <span aria-hidden="true">·</span>
      <span class="inline-flex items-center gap-1">
        <app-icon name="clock" className="h-3.5 w-3.5" />
        {{ post.readingTime }}
      </span>
    </div>

    <h3 class="font-display mt-3 text-xl font-semibold tracking-tight text-ink transition group-hover:text-accent">
      <a [routerLink]="['/blog', post.slug]" class="outline-none">{{ post.title }}</a>
    </h3>
    <p class="mt-3 text-sm leading-relaxed text-ink-soft/75">{{ post.excerpt }}</p>

    <a
      [routerLink]="['/blog', post.slug]"
      class="mt-5 inline-flex items-center gap-2 font-display text-sm font-semibold text-ink"
    >
      Read post
      <app-icon name="arrow-right" className="h-4 w-4 transition group-hover:translate-x-1" />
    </a>
  </div>
</article>
