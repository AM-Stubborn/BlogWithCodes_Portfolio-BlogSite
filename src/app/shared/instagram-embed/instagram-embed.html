@if (href) {
  <div class="mt-8 flex justify-center">
    <a
      [href]="href"
      target="_blank"
      rel="noopener noreferrer"
      class="group relative block w-full max-w-[17.5rem] overflow-hidden rounded-[1.5rem] border border-line bg-ink shadow-lg shadow-ink/15 transition duration-300 hover:-translate-y-0.5 hover:border-accent/40 hover:shadow-xl hover:shadow-accent/10 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent"
      [attr.aria-label]="'Play Instagram reel (opens Instagram)'"
    >
      <div class="relative aspect-[9/16] w-full">
        <img
          [src]="poster | assetUrl"
          [alt]="alt"
          class="h-full w-full object-cover transition duration-500 group-hover:scale-[1.03]"
          loading="lazy"
        />
        <div class="absolute inset-0 bg-gradient-to-t from-ink/80 via-ink/25 to-ink/20"></div>

        <span class="absolute top-3 left-3 inline-flex items-center gap-1.5 rounded-lg bg-white/95 px-2.5 py-1 font-display text-[0.7rem] font-semibold tracking-wide text-ink uppercase shadow-sm backdrop-blur">
          <app-icon name="instagram" className="h-3.5 w-3.5" />
          Instagram Reel
        </span>

        <span
          class="absolute inset-0 flex items-center justify-center"
          aria-hidden="true"
        >
          <span class="inline-flex h-14 w-14 items-center justify-center rounded-full bg-white/95 text-ink shadow-lg transition duration-300 group-hover:scale-110 group-hover:bg-white">
            <app-icon name="play" className="ml-0.5 h-6 w-6" />
          </span>
        </span>

        <span class="absolute inset-x-3 bottom-3 text-center font-display text-xs font-semibold text-white/95">
          Tap to play on Instagram
          <span class="mt-0.5 flex items-center justify-center gap-1 text-[0.7rem] font-medium text-white/75">
            Opens in a new tab
            <app-icon name="external" className="h-3 w-3" />
          </span>
        </span>
      </div>
    </a>
  </div>
}
